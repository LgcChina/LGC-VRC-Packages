# LGC VPM listing workflow revision 1.0.1 — 2026-11-21
name: Build Repo Listing

on: 
  workflow_dispatch:  # 保留手动触发
  push:
    branches: main
    # 核心修正：路径匹配Website目录下的文件 + 根目录的source.json
    paths: 
      - .github/workflows/build-listing.yml
      - source.json                # 根目录的source.json
      - Website/styles.css         # Website下的CSS
      - Website/app.js             # Website下的JS
      - Website/index.html         # Website下的HTML

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
  
# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true
  
env:
  listPublishDirectory: Website
  pathToCi: ci

jobs:
  
  build-listing:
    name: build-listing
    outputs:
      artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    runs-on: ubuntu-latest
    steps:
      
      - uses: actions/checkout@v4 # 检出当前仓库
      - uses: actions/checkout@v4 # 检出自动化工具仓库
        with:
          repository: vrchat-community/package-list-action
          path: ${{env.pathToCi}}
          clean: false # 保留当前仓库文件，避免source.json被清空
          
      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{env.pathToCi}}/.nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj') }}
          
      - name: Install runtime required by the listing builder
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '6.0.x'

      - name: Build Package Version Listing
        run: ${{env.pathToCi}}/build.cmd BuildMultiPackageListing --root ${{env.pathToCi}} --list-publish-directory $GITHUB_WORKSPACE/${{env.listPublishDirectory}}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{env.listPublishDirectory}}

  deploy:
    name: deploy-pages
    needs: build-listing
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT: ${{ needs.build-listing.outputs.artifact_name }}
        shell: bash
        run: |
          for attempt in {1..12}; do
            if artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq ".artifacts[] | select(.name == \"$EXPECTED_ARTIFACT\" and .expired == false) | .id")"; then
              if [[ "$artifact_id" =~ ^[0-9]+$ ]]; then
                echo "Pages artifact metadata is ready: $artifact_id"
                exit 0
              fi
            fi
            echo "Waiting for Pages artifact metadata ($attempt/12)"
            sleep 5
          done
          echo "::error::The uploaded Pages artifact is not visible in this workflow run."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build-listing.outputs.artifact_name }}
